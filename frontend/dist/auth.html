<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход</title>
    <link rel="icon" href="/public/favicon.ico" />
    <script type="module" crossorigin src="/assets/auth.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/clientLogger.js">
    <link rel="modulepreload" crossorigin href="/assets/matrixRain.js">
    <link rel="stylesheet" crossorigin href="/assets/auth.css">
  </head>
  <body>
    <canvas id="matrix-bg" class="matrix-bg"></canvas>
    <div class="auth-container">
      <div class="auth-card">
        <div class="logo">
          <h1>Messenger</h1>
          <p>Закрытый доступ по заявкам</p>
        </div>

        <div class="login-section">
          <form id="credentials-form" class="local-form hidden">
            <h3>Шаг 1: Логин и пароль</h3>
            <input id="credentials-username" type="text" autocomplete="username" placeholder="Логин" required />
            <input id="credentials-password" type="password" autocomplete="new-password" placeholder="Пароль (минимум 8 символов)" required />
            <input id="credentials-confirm-password" type="password" autocomplete="new-password" placeholder="Подтвердите пароль" required />
            <button type="submit" class="google-button">Продолжить</button>
          </form>

          <form id="profile-form" class="local-form hidden">
            <h3>Шаг 2: Информация о человеке</h3>
            <p class="setup-hint">Напишите, кто вы и зачем вам доступ. Это увидит администратор.</p>
            <textarea id="profile-about" placeholder="Кто вы, из какой команды, зачем нужен доступ" rows="4" required></textarea>
            <button type="submit" class="google-button">Отправить на подтверждение</button>
          </form>

          <div id="oauth-box">
            <div class="oauth-divider">Вход только через OAuth</div>
            <button id="yandex-login" class="yandex-button" type="button">
              Войти через Яндекс
            </button>

            <button id="google-login" class="google-button" type="button">
              Войти через Google
            </button>

            <div id="telegram-login-container" class="telegram-widget-container"></div>
          </div>
        </div>

        <div id="error-container" class="error-container"></div>
        <div id="status-container" class="status-container"></div>
      </div>
    </div>

  </body>
</html>
