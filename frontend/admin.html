<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Messenger</title>
  </head>
  <body>
    <main class="container">
      <section id="login-panel" class="panel">
        <h1>Admin вход</h1>
        <form id="admin-login-form" class="form">
          <input id="admin-login" name="login" type="text" autocomplete="username" placeholder="Логин" required />
          <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required />
          <button type="submit">Войти</button>
        </form>
        <div id="login-error" class="error"></div>
      </section>

      <section id="requests-panel" class="panel hidden">
        <header class="panel-header">
          <h1>Заявки на доступ</h1>
          <div class="actions">
            <button id="refresh-btn" type="button">Обновить</button>
            <button id="logout-btn" type="button" class="danger">Выйти</button>
          </div>
        </header>
        <div id="requests-list" class="requests-list"></div>
      </section>
    </main>

    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
